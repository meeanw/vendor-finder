name: Refresh SKU index
on:
  schedule:
    # 09:00 UTC is 4:00am EST and 5:00am EDT.
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      new_cap:
        description: 'New SKUs this run (nightly default 2000)'
        default: '2000'
        required: false
      refresh_cap:
        description: 'Oldest delivery notes to refresh (nightly default 300)'
        default: '300'
        required: false
      minutes:
        description: 'Stop after this many minutes (nightly default 45)'
        default: '45'
        required: false
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/build-sku-index.js
      - run: node scripts/build-sku-details.js
        env:
          SKU_DETAILS_NEW: ${{ github.event.inputs.new_cap || '2000' }}
          SKU_DETAILS_REFRESH: ${{ github.event.inputs.refresh_cap || '300' }}
          SKU_DETAILS_MINUTES: ${{ github.event.inputs.minutes || '45' }}
      - name: Commit the index when it changed
        run: |
          git diff --quiet -- sku-index.json sku-details.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sku-index.json sku-details.json
          git commit -m "Refresh the public website SKU index and details"
          git push
